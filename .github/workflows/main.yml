name: 'Baidu Tieba Auto Sign'

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: '检测代码'
        uses: actions/checkout@v3
        with:
          # 必须拉取完整的历史记录，否则无法计算距离上次提交的时间
          fetch-depth: 0 

      - name: '缓存Python环境'
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/Python/3.8.*
          key: ${{ runner.os }}-python-3.8
          restore-keys: |
            ${{ runner.os }}-python-

      - name: '初始化Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: '缓存Pip依赖'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: '安装依赖包'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: '开始签到'
        env:
          BDUSS: ${{ secrets.BDUSS }}
        run: python main.py

      # 🟢 【最终版】智能保活（原生代码版）
      # 逻辑：获取最后一次提交时间 -> 和50天前的时间对比 -> 只有超时了才提交
      - name: '智能保活'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 获取最后一次提交的时间戳
          last_commit_time=$(git log -1 --format=%ct)
          # 获取50天前的时间戳
          threshold_time=$(date -d "50 days ago" +%s)
          
          if [ $last_commit_time -lt $threshold_time ]; then
            echo "距离上次提交已超过50天，执行自动保活..."
            git commit --allow-empty -m "Auto-keepalive to prevent 60-day shutdown"
            git push
          else
            echo "距离上次提交未满50天，跳过保活操作。"
          fi
