name: 'Baidu Tieba Auto Sign'

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# 🟢 【新增 1】赋予 Action 写入仓库的权限，否则无法提交保活代码
permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: '检测代码'
        uses: actions/checkout@v3

      - name: '缓存Python环境'
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/Python/3.8.*
          key: ${{ runner.os }}-python-3.8
          restore-keys: |
            ${{ runner.os }}-python-

      - name: '初始化Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: '缓存Pip依赖'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: '安装依赖包'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: '开始签到'
        env:
          BDUSS: ${{ secrets.BDUSS }}
        run: python main.py

      # 🟢 【新增 2】自动保活步骤
      # 它的作用是：检测如果你超过 50 天没有提交代码，它会自动提交一次空代码
      # 这样 GitHub 就会认为仓库是活跃的，不会再暂停你的定时任务
      - name: '自动保活'
        uses: gautamkrishnar/keepalive-workflow@v1
        with:
          # 默认是 50 天，你可以不用改。
          # 当检测到距离上次提交超过 50 天时，会自动提交一次。
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
