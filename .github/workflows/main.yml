name: 'Baidu Tieba Auto Sign'

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# 必须保留这个权限配置，为了允许提交代码
permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: '检测代码'
        uses: actions/checkout@v3

      - name: '缓存Python环境'
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/Python/3.8.*
          key: ${{ runner.os }}-python-3.8
          restore-keys: |
            ${{ runner.os }}-python-

      - name: '初始化Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: '缓存Pip依赖'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: '安装依赖包'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: '开始签到'
        env:
          BDUSS: ${{ secrets.BDUSS }}
        run: python main.py

      # 🟢 【修改】使用原生 Git 命令进行保活（不依赖第三方插件）
      # 逻辑：每次签到成功后，都会检查日期，如果需要则提交一个空更新
      # 注意：这会在你的 Commit 记录里增加一些 "Auto-keepalive" 的记录，这是正常的
      - name: '防止自动暂停'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Auto-keepalive"
          git push
